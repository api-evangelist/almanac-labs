aid: almanac-labs
name: Almanac Labs
description: >-
  Almanac Labs, Inc. builds Almanac, an enterprise wiki and async collaboration
  platform that consolidates a team's scattered documents into a single,
  organized source of truth. Almanac combines fast document editing, wikis,
  version control, approvals, and workflow/task management to replace tools like
  Confluence, Notion, and Asana, and it publishes company handbooks and
  community-powered documentation. The Almanac API (V1, private beta) lets
  workspaces import and move files and folders, view users and groups, read and
  update document properties, manage who has access to documents, and access and
  update metadata for documents and folders. Almanac integrates with Slack,
  Figma, Loom, and GitHub, and is backed by General Catalyst. This profile was
  enriched by the API Evangelist pipeline from Almanac's public surface.
